# Cấu hình golangci-lint v2 (Bài 53). Chạy: golangci-lint run ./...
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # quên đóng resp.Body
    - errorlint     # so sánh lỗi bằng == hay ép kiểu thay vì errors.Is/As
    - nilerr        # kiểm tra err != nil rồi lại return nil
    - rowserrcheck  # quên kiểm tra rows.Err()
    - sqlclosecheck # quên Close *sql.Rows, *sql.Stmt
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback # defer tx.Rollback(): sau Commit luôn trả về ErrTxDone
        - (*github.com/coder/websocket.Conn).CloseNow
  exclusions:
    generated: strict # bỏ qua file có dòng "Code generated ... DO NOT EDIT." (sqlc, protoc)
    presets:
      - std-error-handling # Close, os.Remove, fmt.Fprint... không kiểm tra lỗi là bình thường
    rules:
      - path: _test\.go # test: bỏ lỗi không kiểm tra, body chưa đóng của response dùng một lần
        linters: [errcheck, bodyclose, errorlint]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/toidicode/taskflow # import của project nằm nhóm riêng, sau thư viện ngoài
