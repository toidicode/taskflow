# TaskFlow API trên VPS: PostgreSQL + Redis + migration + API + notifier (gRPC) + Caddy (HTTPS).
# Deploy: docker compose pull migrate api notifier && docker compose run --rm migrate && docker compose up -d

# giới hạn log của mọi container: tối đa 3 file x 10 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_DB: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chưa đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18: không phải .../data như bản cũ
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "taskflow", "-d", "taskflow"] # qua TCP như migrate, api
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    logging: *logging

  redis: # cache, rate limit, realtime và hàng đợi job (Bài 43-47)
    image: redis:8-alpine
    restart: unless-stopped
    # hàng đợi job phải bền: AOF ghi mỗi lệnh ra đĩa (fsync mỗi giây). Dùng quá 256mb thì lệnh ghi
    # báo lỗi chứ không tự xóa key (noeviction là mặc định, ghi rõ để không ai đổi sang allkeys-lru)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    logging: *logging

  migrate: # chạy một lần mỗi lần deploy rồi thoát
    image: ghcr.io/toidicode/taskflow-api:${TASKFLOW_VERSION:?chưa đặt TASKFLOW_VERSION trong .env}
    command: ["-migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD}@db:5432/taskflow?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  notifier: # notification service gRPC (Bài 49-50), cùng image với API
    image: ghcr.io/toidicode/taskflow-api:${TASKFLOW_VERSION}
    entrypoint: ["/notifier"]
    restart: unless-stopped
    environment:
      TASKFLOW_NOTIFIER_TOKEN: ${TASKFLOW_NOTIFIER_TOKEN:?chưa đặt TASKFLOW_NOTIFIER_TOKEN trong .env}
      TZ: ${TZ:-UTC}
    healthcheck: # grpc.health.v1.Health/Check, không cần token
      test: ["CMD", "/notifier", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 10s # > shutdownTimeout (5s) của notifier
    logging: *logging # không có "ports": chỉ các service trong mạng này gọi được

  api:
    image: ghcr.io/toidicode/taskflow-api:${TASKFLOW_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD}@db:5432/taskflow?sslmode=disable
      TASKFLOW_REDIS_URL: redis://redis:6379/0
      TASKFLOW_NOTIFIER_ADDR: notifier:9090 # token: TASKFLOW_NOTIFIER_TOKEN trong .env
      TASKFLOW_TRUSTED_PROXIES: 10.39.0.10 # chỉ tin X-Forwarded-For do Caddy gửi
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      notifier: # không bắt buộc: notifier chưa lên thì job thông báo lỗi và được chạy lại sau
        condition: service_started
    healthcheck: # như HEALTHCHECK trong image, hỏi dày hơn
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 15s # > TASKFLOW_SHUTDOWN_TIMEOUT (8s)
    logging: *logging # không có "ports": chỉ Caddy gọi được API

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      TASKFLOW_DOMAIN: ${TASKFLOW_DOMAIN:?chưa đặt TASKFLOW_DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # chứng chỉ Let's Encrypt
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 10.39.0.10
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: 10.39.0.0/24 # đổi nếu trùng với mạng nội bộ của VPS

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
