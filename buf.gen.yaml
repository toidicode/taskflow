# buf generate: sinh code Go từ proto/ vào internal/gen/ (code sinh ra được commit).
# Plugin local: protoc-gen-go, protoc-gen-go-grpc cài bằng go install, không cần mạng khi generate.
version: v2
clean: true # xóa internal/gen trước khi sinh lại: file của proto đã xóa không còn sót
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen
    opt: paths=source_relative
